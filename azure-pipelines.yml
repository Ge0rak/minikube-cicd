trigger:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  projectPath: 'SampleApp/SampleApp.csproj'
  dockerRegistryServiceConnection: 'dockerhub-connection'
  imageRepository: 'eograk/sampleapp'
  tag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Build and Push'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET SDK'
            inputs:
              packageType: 'sdk'
              version: '10.0.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore dependencies'
            inputs:
              command: 'restore'
              projects: '$(projectPath)'

          - task: DotNetCoreCLI@2
            displayName: 'Build'
            inputs:
              command: 'build'
              projects: '$(projectPath)'
              arguments: '--configuration $(buildConfiguration)'

          - task: DotNetCoreCLI@2
            displayName: 'Run tests'
            inputs:
              command: 'test'
              projects: 'SampleApp.Tests/SampleApp.Tests.csproj'

          - task: Docker@2
            displayName: 'Build and push Docker image'
            inputs:
              containerRegistry: '$(dockerRegistryServiceConnection)'
              repository: '$(imageRepository)'
              command: 'buildAndPush'
              Dockerfile: '**/Dockerfile'
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: 'Deploy to Minikube'
    dependsOn: BuildAndPush
    pool: 'Default'
    jobs:
      - job: DeployToK8s
        steps:
          - script: |
              kubectl apply -f k8s/
              kubectl rollout status deployment/sampleapp-deployment
            displayName: 'kubectl apply and verify rollout'
